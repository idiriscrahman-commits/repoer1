<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      
      // Suppress Vite HMR WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function (e) {
        if (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;

        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason ? String(e.reason.message || e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>Remix Report Management System</title>
    <meta name="description" content="Secure, responsive, full-stack Admin Report Management System with analytics, comparisons, and PDF/Excel exports." />
    <meta property="og:title" content="Remix Report Management System" />
    <meta property="og:description" content="Secure, responsive, full-stack Admin Report Management System with analytics, comparisons, and PDF/Excel exports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
